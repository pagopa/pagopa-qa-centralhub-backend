name: Release And Deploy

# Standard PagoPA "Release And Deploy" pipeline.
# Triggers:
#   - PR merged on main      → auto release + deploy on dev
#   - merge_group on main    → CI dry-run
#   - workflow_dispatch      → manual run, pick env (dev/uat/prod) and bump
#   - workflow_call          → invoked by other workflows
on:
  merge_group:
    branches: [main]
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
      version:
        required: false
        type: choice
        description: Select the version
        options:
          - patch
          - skip_or_promote
          - new_release
          - breaking_change
      beta:
        required: false
        type: boolean
        description: deploy beta version on AKS
        default: false

  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  packages: write       # push to GHCR
  contents: write       # tag + release notes
  issues: write
  id-token: write       # Azure OIDC federation
  actions: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.get_semver.outputs.semver }}
      environment: ${{ steps.get_env.outputs.environment }}
    steps:
      - name: pull request rejected
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged != true
        run: |
          echo "❌ PR was closed without a merge"
          exit 1

      # ---- Determine SemVer bump --------------------------------------------------
      - run: echo "SEMVER=patch" >> $GITHUB_ENV

      - if: ${{ (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'skip')) }}
        run: echo "SEMVER=skip" >> $GITHUB_ENV
      - if: ${{ (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'patch')) }}
        run: echo "SEMVER=patch" >> $GITHUB_ENV
      - if: ${{ (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'minor')) }}
        run: echo "SEMVER=minor" >> $GITHUB_ENV
      - if: ${{ (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'major')) }}
        run: echo "SEMVER=major" >> $GITHUB_ENV

      - if: ${{ inputs.version == 'new_release' }}
        run: echo "SEMVER=minor" >> $GITHUB_ENV
      - if: ${{ inputs.version == 'breaking_change' }}
        run: echo "SEMVER=major" >> $GITHUB_ENV
      - if: ${{ github.ref_name != 'main' }}
        run: echo "SEMVER=buildNumber" >> $GITHUB_ENV
      - if: ${{ inputs.version == 'skip_or_promote' }}
        run: echo "SEMVER=skip" >> $GITHUB_ENV

      - id: get_semver
        name: Set Output
        run: echo "semver=${{ env.SEMVER }}" >> $GITHUB_OUTPUT

      # ---- Determine target environment ------------------------------------------
      - run: echo "ENVIRNOMENT=${{ inputs.environment }}" >> $GITHUB_ENV
      - if: ${{ inputs.environment == null }}
        run: echo "ENVIRNOMENT=dev" >> $GITHUB_ENV
      - id: get_env
        name: Set Output
        run: echo "environment=${{ env.ENVIRNOMENT }}" >> $GITHUB_OUTPUT

  release:
    name: Create a New Release
    runs-on: ubuntu-latest
    needs: [setup]
    if: ${{ needs.setup.outputs.semver != 'skip' }}
    outputs:
      version: ${{ steps.export.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history + all tags, needed by github-tag-action
          token: ${{ secrets.BOT_TOKEN_GITHUB }}

      # Map our semver values to github-tag-action's `default_bump` input.
      # - patch/minor/major  → bump that segment
      # - buildNumber        → on non-main branches, force a prerelease tag
      # - skip               → handled by the job-level `if` above
      - name: Bump tag (release branch)
        if: ${{ github.ref_name == 'main' }}
        id: bump_main
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          default_bump: ${{ needs.setup.outputs.semver }}
          tag_prefix: ""

      - name: Bump tag (feature branch — prerelease)
        if: ${{ github.ref_name != 'main' }}
        id: bump_feature
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          default_bump: patch
          tag_prefix: ""
          pre_release_branches: ".*"
          append_to_pre_release_tag: "beta"

      - name: Create GitHub Release
        if: ${{ github.ref_name == 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_main.outputs.new_tag }}
          name: ${{ steps.bump_main.outputs.new_tag }}
          body: ${{ steps.bump_main.outputs.changelog }}
          prerelease: false
          token: ${{ secrets.BOT_TOKEN_GITHUB }}

      - name: Export version
        id: export
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "version=${{ steps.bump_main.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.bump_feature.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [setup, release]
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ needs.setup.outputs.semver != 'skip' }}
    steps:
      - name: Build and Push
        id: semver
        uses: pagopa/github-actions-template/ghcr-build-push@d91a1fd0b913c9830589be5d86cdb71c90813fae # v1.5.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.version }}
          build_args: APP_NAME=pagopa-qa-centralhub-backend

  deploy_aks:
    name: Deploy on AKS
    needs: [setup, release, image]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/04_deploy_with_github_runner.yml
    with:
      environment: ${{ needs.setup.outputs.environment }}
      image_tag: ${{ needs.release.outputs.version }}
    secrets: inherit

  notify:
    needs: [setup, release, deploy_aks]
    runs-on: ubuntu-latest
    name: Notify
    if: always()
    steps:
      - name: Report Status
        if: ${{ needs.setup.outputs.environment == 'prod' }}
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
        with:
          status: ${{ needs.deploy_aks.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: 'New Release on Production ${{ needs.release.outputs.version }} has {status_message}'
          message_format: '{emoji} <{run_url}|{workflow}> {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked to <{workflow_url}| workflow file>'
          icon_success: ':white_check_mark:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}

