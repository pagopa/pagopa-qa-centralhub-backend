name: Release And Deploy

# Release and deploy pipeline of the backend.
# Triggers:
#   - PR merged on main      → release (type from the PR labels) + deploy on dev
#   - merge_group on main    → CI dry-run
#   - workflow_dispatch      → manual run: pick the environment (dev/uat/prod) and the release type
#   - workflow_call          → invoked by other workflows (release type: skip)
#
# Release type (SemVer bump):
#   - patch | minor | major → bump the version, tag, create the GitHub release, build the image
#   - skip                  → no bump: the current version (latest stable tag) is rebuilt,
#                             pushed to the registry and deployed with Helm
# On a merged PR the type comes from the PR labels (skip > major > minor > patch; no label = skip).
# On a manual run the default is skip; patch/minor/major stay available on every environment.
# A run on a branch other than main never touches stable versions: it always publishes a
# beta prerelease, whatever the requested type.
on:
  merge_group:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Select the Environment
        options:
          - dev
          - uat
          - prod
        default: dev
      version:
        required: false
        type: choice
        description: Release type (skip = rebuild and deploy the current version)
        options:
          - skip
          - patch
          - minor
          - major
        default: skip
      beta:
        required: false
        type: boolean
        description: deploy beta version on AKS
        default: false

  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  packages: write       # push to GHCR
  contents: write       # tag + release notes
  issues: write
  id-token: write       # Azure OIDC federation
  actions: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.params.outputs.semver }}
      environment: ${{ steps.params.outputs.environment }}
    steps:
      - name: pull request rejected
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged != true
        run: |
          echo "❌ PR was closed without a merge"
          exit 1

      - id: params
        name: Resolve environment and release type
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ENV="${INPUT_ENV:-dev}"
          SEMVER="skip"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SEMVER="${INPUT_VERSION:-skip}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # "skip" is an explicit opt-out and wins over any other label;
            # otherwise the highest level wins (major > minor > patch).
            has_label() { echo "$PR_LABELS" | jq -e --arg l "$1" 'index($l) != null' > /dev/null; }
            if has_label skip; then
              SEMVER="skip"
            elif has_label major; then
              SEMVER="major"
            elif has_label minor; then
              SEMVER="minor"
            elif has_label patch; then
              SEMVER="patch"
            fi
          fi

          # A merged PR always targets main (see the trigger filter); otherwise use the run ref.
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$REF_NAME" != "main" ]; then
            # Never create or overwrite a stable version from a branch: publish a beta instead.
            SEMVER="buildNumber"
          fi

          case "$ENV" in dev|uat|prod) ;; *) echo "::error::Invalid environment: $ENV"; exit 1 ;; esac
          case "$SEMVER" in skip|patch|minor|major|buildNumber) ;; *) echo "::error::Invalid release type: $SEMVER"; exit 1 ;; esac

          echo "Deploying to $ENV with release type $SEMVER"
          {
            echo "environment=$ENV"
            echo "semver=$SEMVER"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Create a New Release
    runs-on: ubuntu-latest
    needs: [setup]
    outputs:
      version: ${{ steps.export.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # A merged PR runs on a pull request ref: use the target branch instead.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0    # full history + all tags, needed by github-tag-action
          token: ${{ secrets.BOT_TOKEN_GITHUB }}

      # skip: keep the current version, i.e. the latest stable tag (X.Y.Z, no prerelease).
      - name: Resolve current version (skip)
        if: ${{ needs.setup.outputs.semver == 'skip' }}
        id: current
        run: |
          set -euo pipefail
          VERSION="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$VERSION" ]; then
            echo "::error::No stable version tag found: run with patch, minor or major to create the first release"
            exit 1
          fi
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Map our semver values to github-tag-action's `default_bump` input.
      # - patch/minor/major  → bump that segment (main only)
      # - buildNumber        → on non-main branches, force a prerelease tag
      - name: Bump tag (release branch)
        if: ${{ contains(fromJSON('["patch","minor","major"]'), needs.setup.outputs.semver) }}
        id: bump_main
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          default_bump: ${{ needs.setup.outputs.semver }}
          tag_prefix: ""

      - name: Bump tag (feature branch — prerelease)
        if: ${{ needs.setup.outputs.semver == 'buildNumber' }}
        id: bump_feature
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.BOT_TOKEN_GITHUB }}
          default_bump: patch
          tag_prefix: ""
          pre_release_branches: ".*"
          append_to_pre_release_tag: "beta"

      - name: Create GitHub Release
        if: ${{ steps.bump_main.outcome == 'success' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.bump_main.outputs.new_tag }}
          name: ${{ steps.bump_main.outputs.new_tag }}
          body: ${{ steps.bump_main.outputs.changelog }}
          prerelease: false
          token: ${{ secrets.BOT_TOKEN_GITHUB }}

      - name: Export version
        id: export
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          MAIN_VERSION: ${{ steps.bump_main.outputs.new_version }}
          BETA_VERSION: ${{ steps.bump_feature.outputs.new_version }}
        run: |
          set -euo pipefail
          VERSION="${CURRENT_VERSION:-${MAIN_VERSION:-$BETA_VERSION}}"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine the version to deploy"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  image:
    needs: [setup, release]
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Build and Push
        id: semver
        uses: pagopa/github-actions-template/ghcr-build-push@d91a1fd0b913c9830589be5d86cdb71c90813fae # v1.5.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.version }}
          build_args: APP_NAME=pagopa-qa-centralhub-backend

  deploy_aks:
    name: Deploy on AKS
    needs: [setup, release, image]
    uses: ./.github/workflows/04_deploy_with_github_runner.yml
    with:
      environment: ${{ needs.setup.outputs.environment }}
      image_tag: ${{ needs.release.outputs.version }}
      branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
    secrets: inherit

  notify:
    needs: [setup, release, deploy_aks]
    runs-on: ubuntu-latest
    name: Notify
    if: always()
    steps:
      - name: Report Status
        if: ${{ needs.setup.outputs.environment == 'prod' }}
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2
        with:
          status: ${{ needs.deploy_aks.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: 'New Release on Production ${{ needs.release.outputs.version }} has {status_message}'
          message_format: '{emoji} <{run_url}|{workflow}> {status_message} in <{repo_url}|{repo}>'
          footer: 'Linked to <{workflow_url}| workflow file>'
          icon_success: ':white_check_mark:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
