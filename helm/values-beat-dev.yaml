# Helm values for Celery Beat (scheduler).
# Same image as the API/worker, different command: runs `celery beat` to enqueue
# scheduled tasks defined in app/tasks/schedule.py.
#
# Deploy as a THIRD helm release pointing at the same chart:
#   helm upgrade --install qa-centralhub-beat-dev ./helm -f helm/values-beat-dev.yaml -n <ns>
#
# IMPORTANT: replicas MUST stay = 1, otherwise scheduled tasks would be enqueued
# multiple times (once per beat pod). Do NOT enable autoscaling here.

microservice-chart:
  namespace: "qa"
  nameOverride: "qa-centralhub-beat"
  fullnameOverride: "qa-centralhub-beat"
  image:
    repository: ghcr.io/pagopa/pagopa-qa-centralhub-backend
    tag: "0.1.0"
    pullPolicy: Always

  # Override default uvicorn CMD: run Celery Beat (the scheduler) instead.
  # `-A app.tasks.schedule` ensures the beat_schedule dict is imported and every
  # task module referenced there gets registered with the Celery app.
  container:
    command:
      - "celery"
    args:
      - "-A"
      - "app.tasks.schedule"
      - "beat"
      - "--loglevel=info"
      - "--schedule=/tmp/celerybeat-schedule"

  # Beat doesn't serve HTTP and has no useful health endpoint.
  livenessProbe:
    create: false
  readinessProbe:
    create: false
  startupProbe:
    create: false

  deployment:
    create: true
    replicas: 1   # MUST be 1 — see note above

  service:
    create: false
    type: ClusterIP
    ports: []

  ingress:
    create: false
    host: ""
    path: ""
    servicePort: 8080

  serviceAccount:
    create: false
    annotations: {}
    name: "qa-workload-identity"

  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000

  resources:
    requests:
      memory: "256Mi"
      cpu: "0.05"
    limits:
      memory: "512Mi"
      cpu: "0.20"

  # NEVER autoscale beat — exactly one scheduler must run at a time.
  autoscaling:
    enable: false
    minReplica: 1
    maxReplica: 1

  envConfig:
    APP_VERSION: "0.1.0"
    DEBUG: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: "qa-centralhub-beat"

  # Beat only enqueues task names + args on Redis; it does NOT execute them, so
  # it doesn't need DB credentials or integration tokens. Just Redis.
  envSecret:
    REDIS_URL: "qa-centralhub-redis-url"

  keyvault:
    name: "pagopa-d-itn-qa-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user

  canaryDelivery:
    create: false
    deployment:
      image:
        tag: "0.0.0"

