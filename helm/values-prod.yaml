# PROD — mirror of values-dev.yaml with prod-grade defaults. Review TODOs before first prod deploy.

microservice-chart:
  namespace: "qa"
  nameOverride: "qa-centralhub-backend"
  fullnameOverride: "qa-centralhub-backend"
  image:
    repository: ghcr.io/pagopa/pagopa-qa-centralhub-backend
    tag: "0.1.0"
    pullPolicy: Always

  livenessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  deployment:
    create: true
    replicas: 2

  service:
    create: true
    type: ClusterIP
    ports:
      - 8080

  ingress:
    create: true
    host: "qa-central-hub.itn.internal.platform.pagopa.it"
    path: /pagopa-qa-central-hub-backend-service/(.*)
    servicePort: 8080

  serviceAccount:
    create: false
    annotations: {}
    name: "qa-workload-identity"

  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000

  resources:
    requests:
      memory: "1024Mi"
      cpu: "0.50"
    limits:
      memory: "3Gi"
      cpu: "1.5"

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 5
    pollingInterval: 10
    cooldownPeriod: 50
    triggers:
      - type: cpu
        metadata:
          type: Utilization
          value: "75"
      - type: memory
        metadata:
          type: Utilization
          value: "80"

  envConfig:
    APP_VERSION: "0.1.0"
    DEBUG: "false"
    CORS_ORIGINS: '["https://qa-central-hub.platform.pagopa.it"]'   # TODO confirm prod frontend host
    OIDC_ISSUER: ""
    OIDC_AUDIENCE: "qa-hub-backend"
    JIRA_BASE_URL: "https://pagopa.atlassian.net"
    JIRA_EMAIL: "cristiano.sticca@pagopa.it"
    PSP_FEE_JSON_URL: "https://pagopa-afm-p-st-fee.s3.eu-central-1.amazonaws.com/output_elenco_servizi.json"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SERVICE_NAME: "qa-centralhub-backend"

  # TODO: confirm PROD Key Vault name and that the secrets are populated there.
  envSecret:
    DATABASE_URL: "qa-centralhub-database-url"
    REDIS_URL: "qa-centralhub-redis-url"
    JWT_SECRET: "qa-centralhub-jwt-secret"
    ENCRYPTION_KEY: "qa-centralhub-encryption-key"
    GITHUB_TOKEN: "qa-centralhub-github-token"
    JIRA_API_TOKEN: "qa-centralhub-jira-api-token"

  keyvault:
    name: "pagopa-p-itn-qa-kv"   # TODO confirm
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_type
                operator: In
                values:
                  - user

  canaryDelivery:
    create: false
    deployment:
      image:
        tag: "0.0.0"

